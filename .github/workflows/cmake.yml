# This workflow is for a CMake project running on multiple platforms. 
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake Build and Test 

on:
  workflow_call:
    inputs:
      build_type:
        description: 'Build type (e.g., "Debug", "Release", "RelWithDebInfo", "MinSizeRel")'
        default: '"Debug"'
        required: true
        type: string
      upload_artifacts:
        description: 'Whether to upload artifacts (true/false)'
        default: false
        required: true
        type: boolean

jobs:
  cmake_build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following configurations:
      # - Multiple platforms (Windows, Linux, macOS)
      # - Multiple compilers (cl, gcc, clang)
      # - Multiple library types (static, shared)
      # windows-latest now floats to Windows Server 2025 / Visual Studio 2026 (MSVC v14.50+).
      # Pin to windows-2022 to guarantee MSVC 2022 (toolset v14.38+), which is what Unreal 5.8
      # requires at minimum and what "cl" builds here need to stay ABI-compatible with.
      matrix:
        os: [ubuntu-latest, windows-2022, macOS-latest]
        build_type: ${{ fromJSON(format('[{0}]', inputs.build_type || '"Debug","Release"')) }}
        c_compiler: [gcc, clang, cl]
        lib_type: [static, shared]
        dependency_mode: [default, no_deps]
        include:
          - os: windows-2022
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macOS-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-2022
            c_compiler: gcc
          - os: windows-2022
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: macOS-latest
            c_compiler: cl
          - os: macOS-latest
            c_compiler: gcc
          - lib_type: shared
            dependency_mode: no_deps

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        # Map OS to platform
        if [ "${{ runner.os }}" == "Linux" ]; then
          echo "platform=linux_x64" >> "$GITHUB_OUTPUT"
        elif [ "${{ runner.os }}" == "Windows" ]; then
          echo "platform=win64" >> "$GITHUB_OUTPUT"
        elif [ "${{ runner.os }}" == "macOS" ]; then
          echo "platform=osx" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install libc++ on Ubuntu
      if: matrix.os == 'ubuntu-latest' && matrix.c_compiler == 'clang'
      run: |
        sudo apt-get update
        sudo apt-get install -y libc++-dev libc++abi-dev

    - name: Display Clang Info
      if: matrix.os == 'ubuntu-latest' && matrix.c_compiler == 'clang'
      run: |
        clang --version
        clang++ --version
        echo "Checking clang headers..."
        clang++ -v -E -x c++ /dev/null
        echo "check lld..."
        ldd --version

    - name: Install vcpkg (Linux/macOS)
      if: runner.os != 'Windows' && matrix.dependency_mode != 'no_deps'
      shell: bash
      run: |
        git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
        "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
        echo "$HOME/vcpkg" >> "$GITHUB_PATH"

    - name: Install vcpkg (Windows)
      if: runner.os == 'Windows' && matrix.dependency_mode != 'no_deps'
      shell: pwsh
      run: |
        git clone https://github.com/microsoft/vcpkg.git "$env:USERPROFILE\vcpkg"
        & "$env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
        echo "VCPKG_ROOT=$env:USERPROFILE\vcpkg" >> $env:GITHUB_ENV
        echo "$env:USERPROFILE\vcpkg" >> $env:GITHUB_PATH

    - name: Build, Test, and Package with setup.py
      shell: bash
      run: |
        SHARED_FLAG=""
        if [ "${{ matrix.lib_type }}" == "shared" ]; then
          SHARED_FLAG="--shared"
        fi

        DEPENDENCY_FLAGS=""
        if [ "${{ matrix.dependency_mode }}" == "no_deps" ]; then
          DEPENDENCY_FLAGS="--no_vcpkg --no_curl"
        fi

        if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
          python setup.py --platform ${{ steps.strings.outputs.platform }} --compiler ${{ matrix.c_compiler }} --cfg ${{ matrix.build_type }} $SHARED_FLAG $DEPENDENCY_FLAGS --build --test
        else
          python setup.py --platform ${{ steps.strings.outputs.platform }} --cfg ${{ matrix.build_type }} $SHARED_FLAG $DEPENDENCY_FLAGS --build --test
        fi
        
    - name: Upload Build Artifact
      if: ${{ inputs.upload_artifacts && success() }}
      uses: actions/upload-artifact@v5
      with:
        name: ga-cpp-sdk-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}-${{ matrix.lib_type }}-${{ matrix.dependency_mode }}
        path: ${{ steps.strings.outputs.build-output-dir }}/package/
        retention-days: 3
    
