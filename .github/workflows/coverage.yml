name: Test Coverage

on: [pull_request, workflow_dispatch]

jobs:
  coverage:
    name: Report Test Coverage
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Cache vcpkg binaries
      uses: actions/cache@v4
      with:
        path: ~/.cache/vcpkg/archives
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: vcpkg-${{ runner.os }}-

    - name: Install vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
        "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
        echo "$HOME/vcpkg" >> "$GITHUB_PATH"

    - name: Setup LCOV
      uses: hrishikesh-kadam/setup-lcov@v1
      with:
        ref: v2.3.2 # apt's lcov 2.0 emits corrupt per-file rates for this codebase

    - name: Build, test and capture coverage
      run: python3 setup.py --platform linux_x64 --compiler gcc --build --test --coverage

    - name: Report code coverage
      uses: zgosalvez/github-actions-report-lcov@v7.2.0
      with:
        coverage-files: build/cov.info.cleaned
        minimum-coverage: 30
        artifact-name: code-coverage-report
        github-token: ${{ secrets.GITHUB_TOKEN }}
        update-comment: true
